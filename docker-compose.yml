# Optional FlareSolverr service for Cloudflare bypass.
# Run: docker compose up -d flaresolverr
# Update: docker compose pull flaresolverr && docker compose up -d flaresolverr
#
# Strigil auto-engages FlareSolverr when Cloudflare is detected (no --flaresolverr needed).
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    ports:
      - "8191:8191"
    restart: unless-stopped
